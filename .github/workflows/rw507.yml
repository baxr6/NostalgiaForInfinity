name: rw507 backtests

# 507 rework backtests. Push a new rw507/jobs.json (list of {arm, y, s}) to this branch to run it.
on:
  push:
    branches: [rw507-ci]
    paths: ["rw507/jobs.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: echo "matrix=$(jq -c . rw507/jobs.json)" >> "$GITHUB_OUTPUT"

  backtest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Data and markets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker pull -q ghcr.io/iterativv/ci-strategy-backtesting@sha256:d407a1563f586a50bbc52b6e512cedc65cfc8d9681e5bf5391186f9747d953a0 &
          for i in 1 2 3 4 5; do  # release downloads hit transient HTTP 500s
            gh release download rw507-data-v1 -R "${{ github.repository }}" -D dl --clobber \
              -p "${{ matrix.y }}_${{ matrix.s }}.tar.zst" -p "markets_${{ matrix.mk || 'rw' }}.json.zst" -p btc.tar.zst && break
            [ $i = 5 ] && exit 1; sleep $((i * 15))
          done
          mkdir -p data && zstd -dc "dl/${{ matrix.y }}_${{ matrix.s }}.tar.zst" | tar -x -C data
          zstd -dc dl/btc.tar.zst | tar -x -C data  # BTC informatives (X8 reads BTC on every timeframe)
          zstd -dq "dl/markets_${{ matrix.mk || 'rw' }}.json.zst" -o rw507/mk/markets_rw.json
          rm -rf dl && wait && chmod -R a+rwX rw507 data
      - name: Swap (F)
        if: matrix.y == 'F'
        run: |
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile || true
          D=/; [ -d /mnt ] && [ $(df -BG --output=avail /mnt | tail -1 | tr -dc 0-9) -gt $(df -BG --output=avail / | tail -1 | tr -dc 0-9) ] && D=/mnt
          G=$(( $(df -BG --output=avail $D | tail -1 | tr -dc 0-9) - 4 )); [ $G -gt 16 ] && G=16
          echo "swap ${G}G on $D"; if [ $G -ge 4 ]; then sudo fallocate -l ${G}G $D/swapfile2 && sudo chmod 600 $D/swapfile2 && sudo mkswap $D/swapfile2 >/dev/null && sudo swapon $D/swapfile2 || echo "swap setup failed"; fi
          free -g
      - name: Backtest
        run: |
          docker run --rm --network none -v "$PWD:/w" -w /w --entrypoint "" \
            -e FT_MARKETS_FILE=/w/rw507/mk/markets_rw.json -e PYTHONPATH=/w/rw507/mk -e EXPORT=${{ matrix.ex || 'trades' }} \
            ghcr.io/iterativv/ci-strategy-backtesting@sha256:d407a1563f586a50bbc52b6e512cedc65cfc8d9681e5bf5391186f9747d953a0 \
            bash rw507/run_gh.sh "${{ matrix.arm }}" "${{ matrix.y }}" "${{ matrix.s }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rw-${{ matrix.arm }}-${{ matrix.y }}-${{ matrix.s }}
          path: rw507/out/
          retention-days: 30

  collect:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rw-*
          path: out
          merge-multiple: true
      - run: find out -name row.tsv | sort | xargs cat > results.tsv; wc -l results.tsv; cat results.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: results
          path: results.tsv
